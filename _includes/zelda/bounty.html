{% capture key_base %}bounties_{{ include.set }}{% endcapture %}
{% capture form_key %}bounties[{{ include.set }}]{% endcapture %}

<ol class="bounty collapsed">
{% for location in include.data.locations %}
<li>
  <label for="{{ key_base }}_{{ forloop.index }}">
    <input id="{{ key_base }}_{{ forloop.index }}" type="checkbox" name="{{ form_key }}[{{ location[0] }}]" value="defeated" /> {{ location[1] }}
  </label>
</li>
{% endfor %}
</ol>
